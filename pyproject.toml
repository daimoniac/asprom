[project]
name = "asprom"
version = "0.1.0"
description = "Assault Profile Monitor - network security compliance scanner"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anyascii==0.3.2",
    "mysqlclient==2.2.4",
    "python-crontab==3.2.0",
    "netaddr==1.3.0",
    "paste==3.10.1",
    "bottle==0.13.1",
    "config==0.4.2",
    "croniter==3.0.3",
    "prometheus-client==0.20.0",
    "python-nmap==0.7.1",
    "structlog>=24.0.0",
    "alembic>=1.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "testcontainers[mysql]>=4.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = [".", "inc", "tests"]
exclude = ["docker/patch-crontab.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E722"]

[tool.ruff.lint.per-file-ignores]
"aspromNagiosCheck.py" = ["F821"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_return_any = false
warn_unused_ignores = true

[tool.coverage.run]
source = ["inc"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]
